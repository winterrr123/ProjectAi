<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Product Vision</title>
    <link rel="icon" type="image/png" href="/static/assets/logo.png">
    <link rel="stylesheet" href="/static/css/style.css?v=5.0">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f6f7f8;
            padding: 16px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 1px solid #e3e5e8;
            border-radius: 6px;
            padding: 32px 28px 24px;
            text-align: left;
        }

        .login-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e3e5e8;
        }

        .login-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .login-title {
            font-size: 17px;
            font-weight: 600;
            color: #1d2125;
            line-height: 1.2;
        }

        .login-subtitle {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecdd3;
            border-left: 3px solid #b91c1c;
            color: #991b1b;
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
        }

        .google-wrapper {
            display: flex;
            justify-content: center;
            margin: 16px 0;
            min-height: 44px;
        }

    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="/static/assets/logo.png" alt="Product Vision" class="login-logo" />
            <div>
                <h1 class="login-title">Product Vision</h1>
                <p class="login-subtitle">Hệ thống đếm sản phẩm nội bộ</p>
            </div>
        </div>

        <div id="originNoticeBox" style="display: none;"></div>
        <div id="alertBox" class="alert-error"></div>

        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
            Đăng nhập bằng tài khoản được cấp quyền để truy cập hệ thống:
        </p>

        <!-- Google Sign-In Container -->
        <div id="g_id_onload"
             data-client_id="{{ google_client_id }}"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false"
             data-cancel_on_tap_outside="true">
        </div>

        <div class="google-wrapper" id="googleBtnWrapper">
            <div id="gsiButtonTarget">
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="sign_in_with"
                     data-shape="rectangular"
                     data-logo_alignment="left"
                     data-width="340">
                </div>
            </div>
        </div>

        <div id="loginLoadingState" style="display: none; padding: 8px 0; font-size: 12px; color: var(--accent); text-align: center;">
            Đang xác thực thông tin tài khoản…
        </div>

    </div>

    <script>
        const googleClientId = "{{ google_client_id }}";

        function runDomainDiagnostics() {
            const host = window.location.hostname;
            const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
            const alertBox = document.getElementById('originNoticeBox');

            if (port !== '8000') {
                alertBox.innerHTML = `
                    <div style="background: #fffbeb; border: 1px solid #fde68a; border-left: 3px solid #b45309; padding: 8px 12px; font-size: 12px; border-radius: 4px; margin-bottom: 14px; color: #92400e;">
                        Đang truy cập cổng ${port}. Google OAuth được cấu hình cho cổng 8000.
                        <a href="http://localhost:8000/login" style="color: #2563eb; font-weight: 500; text-decoration: underline; margin-left: 4px;">
                            Mở qua localhost:8000
                        </a>
                    </div>
                `;
                alertBox.style.display = 'block';
            } else if (host === '127.0.0.1') {
                alertBox.innerHTML = `
                    <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-left: 3px solid #2563eb; padding: 8px 12px; font-size: 12px; border-radius: 4px; margin-bottom: 14px; color: #1e40af;">
                        Khuyên dùng localhost:8000 thay cho 127.0.0.1.
                        <a href="http://localhost:8000/login" style="color: #2563eb; font-weight: 500; text-decoration: underline; margin-left: 4px;">
                            Chuyển sang localhost:8000
                        </a>
                    </div>
                `;
                alertBox.style.display = 'block';
            }
        }

        function initGoogleGSI() {
            if (!googleClientId) return;

            if (window.google && google.accounts && google.accounts.id) {
                try {
                    google.accounts.id.initialize({
                        client_id: googleClientId,
                        callback: handleCredentialResponse,
                        auto_select: false,
                        cancel_on_tap_outside: true,
                        context: 'signin'
                    });

                    const target = document.getElementById('gsiButtonTarget');
                    if (target) {
                        target.innerHTML = '';
                        google.accounts.id.renderButton(target, {
                            type: 'standard',
                            theme: 'outline',
                            size: 'large',
                            text: 'signin_with',
                            shape: 'rectangular',
                            logo_alignment: 'left',
                            width: 340
                        });
                    }
                } catch (e) {
                    console.warn('Google GSI init note:', e);
                }
            } else {
                setTimeout(initGoogleGSI, 200);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            runDomainDiagnostics();
            initGoogleGSI();
        });

        async function quickDevLogin(name, email) {
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/dev-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    const params = new URLSearchParams(window.location.search);
                    const nextUrl = params.get('next') || '/';
                    window.location.href = nextUrl;
                } else {
                    alertBox.textContent = data.detail || data.message || 'Đăng nhập thử nghiệm thất bại.';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.textContent = 'Không thể kết nối đến máy chủ xác thực.';
                alertBox.style.display = 'block';
            }
        }

        async function handleCredentialResponse(response) {
            const alertBox = document.getElementById('alertBox');
            const loadingState = document.getElementById('loginLoadingState');
            const googleBtnWrapper = document.getElementById('googleBtnWrapper');
            
            alertBox.style.display = 'none';
            if (loadingState) loadingState.style.display = 'block';
            if (googleBtnWrapper) googleBtnWrapper.style.opacity = '0.5';

            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    const params = new URLSearchParams(window.location.search);
                    const nextUrl = params.get('next') || '/';
                    window.location.href = nextUrl;
                } else {
                    if (loadingState) loadingState.style.display = 'none';
                    if (googleBtnWrapper) googleBtnWrapper.style.opacity = '1';
                    alertBox.textContent = data.detail || data.message || 'Đăng nhập Google thất bại.';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                if (loadingState) loadingState.style.display = 'none';
                if (googleBtnWrapper) googleBtnWrapper.style.opacity = '1';
                alertBox.textContent = 'Không thể kết nối đến máy chủ xác thực.';
                alertBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
